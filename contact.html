<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 基本的なファビコン設定 -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">

 <!-- 追加サイズのファビコン -->
  <link rel="icon" sizes="32x32" href="favicon_32.ico"> <!-- 32x32ピクセル -->
  <link rel="icon" sizes="16x16" href="favicon_16.ico"> <!-- 16x16ピクセル -->
  <link rel="apple-touch-icon" sizes="180x180" href="favicon_128.ico"> <!-- Apple デバイス用 -->

  <title>お問い合わせ | 伊都クリーン株式会社</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
      color: #333;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 30px;
      background: #f0f4f8;
    }
    header img {
      height: 80px;
    }
    nav a {
      margin-left: 30px;
      text-decoration: none;
      color: #555;
      font-weight: bold;
      font-size: 1.2em;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      text-align: center;
      font-size: 3em;
      margin-bottom: 40px;
      color: #2d3d56;
    }
    .contact-info {
      font-size: 1.4em;
      line-height: 1.6;
      margin-bottom: 40px;
    }
    .contact-info p {
      margin-bottom: 10px;
    }
    .contact-info strong {
      color: #FF6347;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      font-size: 1.2em;
      margin-bottom: 5px;
      display: block;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      font-size: 1.2em;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .form-group textarea {
      resize: vertical;
      height: 150px;
    }
    .form-group button {
      background-color: #FF6347;
      color: white;
      font-size: 1.4em;
      padding: 15px 25px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .form-group button:hover {
      background-color: #FF4500;
    }
    footer {
      text-align: center;
      font-size: 1.1em;
      color: #FFF;
      padding: 20px;
      background: #333;
      color: white;
    }
    footer a {
      color: white;
      text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }

    /* レスポンシブデザイン */
    @media (max-width: 1200px) {
      h1 {
        font-size: 2.5em;
      }
      .contact-info p {
        font-size: 1.3em;
      }
      .form-group label {
        font-size: 1.1em;
      }
      .form-group input, .form-group textarea {
        font-size: 1.1em;
      }
      footer {
        font-size: 1em;
      }
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2em;
      }
      .contact-info p {
        font-size: 1.2em;
      }
      .form-group label {
        font-size: 1em;
      }
      .form-group input, .form-group textarea {
        font-size: 1em;
      }
      footer {
        font-size: 0.9em;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.8em;
      }
      .contact-info p {
        font-size: 1em;
      }
      .form-group label {
        font-size: 1em;
      }
      .form-group input, .form-group textarea {
        font-size: 1em;
      }
      footer {
        font-size: 0.9em;
      }
    }
  </style>
</head>
<body>

<header>
    <img src="ロゴ.png" alt="伊都クリーン株式会社ロゴ">
    <nav>
      <a href="index.html">ホーム</a>
      <a href="service.html">事業内容</a>
      <a href="works.html">施工事例</a>
      <a href="contact.html">お問い合わせ</a>
    </nav>
  </header>

<div class="container">
  <h1>お問い合わせ</h1>

  <div class="contact-info">
    <h2>会社情報</h2>
    <p><strong>電話番号：</strong>080-9107-0957</p>
    <p><strong>メール：</strong><a href="mailto:shun@ito-clean.co.jp">shun@ito-clean.co.jp</a></p>
    <p><strong>営業時間：</strong>平日 8:30〜17:00</p> <!-- 営業時間を追加 -->
  </div>

  <h2>お問い合わせフォーム</h2>
  <form action="mailto:shun@ito-clean.co.jp" method="post" enctype="text/plain">
    <div class="form-group">
      <label for="name">お名前</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div class="form-group">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="form-group">
      <label for="message">お問い合わせ内容</label>
      <textarea id="message" name="message" required></textarea>
    </div>
    <div class="form-group">
      <button type="submit">送信する</button>
    </div>
  </form>
</div>

<footer>
  <a href="index.html">ホームに戻る</a>
  <p>&copy; 2025 伊都クリーン株式会社. All Rights Reserved.</p>
</footer>

</body>
</html>
